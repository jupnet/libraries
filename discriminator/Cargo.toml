[package]
name = "spl-discriminator"
version = "0.5.1"
description = "Solana Program Library 8-Byte Discriminator Management"
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
repository = "https://github.com/solana-program/libraries"
license = "Apache-2.0"
edition = "2021"

[features]
borsh = ["dep:borsh"]

[dependencies]
borsh = { version = "1", optional = true, features = ["derive"] }
bytemuck = { version = "1.23.2", features = ["derive"] }
solana-program-error = { git = "https://github.com/jupnet/jupnet-sdk", branch = "fix/sdk-deps" }
solana-sha256-hasher = { git = "https://github.com/jupnet/jupnet-sdk", branch = "fix/sdk-deps", features = ["sha2"] }
spl-discriminator-derive = { version = "0.2.0", path = "../discriminator-derive" }

[dev-dependencies]
spl-discriminator = { path = ".", features = ["borsh"] }

[lib]
crate-type = ["lib"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
