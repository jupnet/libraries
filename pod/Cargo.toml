[package]
name = "spl-pod"
version = "0.7.1"
description = "Solana Program Library Plain Old Data (Pod)"
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
repository = "https://github.com/solana-program/libraries"
license = "Apache-2.0"
edition = "2021"

[features]
serde-traits = ["dep:serde"]
borsh = ["dep:borsh", "solana-pubkey/borsh"]

[dependencies]
borsh = { version = "1.5.7", features = ["derive", "unstable__schema"], optional = true }
bytemuck = { version = "1.23.2" }
bytemuck_derive = { version = "1.10.1" }
ethnum = "1.5.1"
num-derive = "0.4"
num_enum = "0.7"
num-traits = "0.2"
serde = { version = "^1.0", optional = true }
solana-program-error = { git = "https://github.com/jupnet/jupnet-sdk" }
solana-program-option = { git = "https://github.com/jupnet/jupnet-sdk" }
solana-pubkey = { git = "https://github.com/jupnet/jupnet-sdk" }
solana-zk-sdk = { git = "https://github.com/jupnet/zk-elgamal-proof", branch = "jupnet" }
thiserror = "^2.0"

[dev-dependencies]
serde_json = "1.0.145"
base64 = { version = "0.22.1" }

[lib]
crate-type = ["lib"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
